# Docker Compose for Husky A300 Isaac Sim + ROS 2 Bridge
#
# Usage:
#   xhost +local:docker          # allow container to access display (run once)
#   docker compose up             # start both containers
#   docker compose up isaac-sim   # start only the simulation
#   docker compose up rviz        # start only the RViz viewer
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed
#   - Docker with GPU support
#   - NGC access for nvcr.io/nvidia/isaac-sim:5.1.0

services:
  # ── Isaac Sim: runs the simulation headless ──────────────────────────────
  isaac-sim:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    container_name: husky-isaac-sim
    # Run as root to avoid permission errors on /isaac-sim/.cache, .local, etc.
    user: "0:0"
    runtime: nvidia
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.bridge/humble/lib:/isaac-sim/exts/isaacsim.ros2.bridge/humble/bin:${LD_LIBRARY_PATH}
    network_mode: host
    volumes:
      # Project files
      - ./simulation:/workspace/simulation:ro
      - ./scripts:/workspace/scripts:ro
      - ./Kemabots-Robotics-Sim-Assignment:/workspace/Kemabots-Robotics-Sim-Assignment:ro
      # Isaac Sim caches (persist between runs for faster startup)
      - isaac-cache:/isaac-sim/.cache
      - isaac-computecache:/isaac-sim/.nv/ComputeCache
      - isaac-logs:/isaac-sim/.nvidia-omniverse/logs
      - isaac-config:/isaac-sim/.nvidia-omniverse/config
      - isaac-data:/isaac-sim/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c "
        /isaac-sim/python.sh /workspace/scripts/create_warehouse_scene.py
      "

  # ── RViz2: visualises the robot and TF tree ──────────────────────────────
  rviz:
    image: osrf/ros:humble-desktop
    container_name: husky-rviz
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./scripts:/workspace/scripts:ro
      - ./Kemabots-Robotics-Sim-Assignment:/workspace/Kemabots-Robotics-Sim-Assignment:ro
    depends_on:
      - isaac-sim
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        ros2 launch /workspace/scripts/view_in_rviz.launch.py
      "

volumes:
  isaac-cache:
  isaac-computecache:
  isaac-logs:
  isaac-config:
  isaac-data:
